<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JavaScript Game Boy Emulator</title>
  <style>
    body {
      background-color: #222;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .emulator {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .screen-container {
      position: relative;
      width: 320px;
      height: 288px;
      background-color: #9bbc0f;
      padding: 40px;
      border-radius: 20px;
      border: 4px solid #0f380f;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
    }
    #gameboy-screen {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      width: 320px;
      height: 288px;
      background-color: #0f380f;
    }
    .controls {
      margin-top: 20px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }
    button {
      background-color: #8b8b8b;
      color: #fff;
      border: none;
      padding: 10px 15px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #9bbc0f;
    }
    .file-input {
      display: none;
    }
    .info {
      margin-top: 20px;
      text-align: center;
      max-width: 600px;
    }
    .status {
      font-family: monospace;
      margin-top: 10px;
      padding: 8px;
      background-color: #333;
      border-radius: 4px;
      width: 100%;
      text-align: left;
    }
    kbd {
      background-color: #333;
      border-radius: 3px;
      border: 1px solid #666;
      box-shadow: 0 1px 0 rgba(0,0,0,0.2);
      color: #fff;
      display: inline-block;
      font-size: 0.85em;
      font-weight: bold;
      line-height: 1;
      padding: 3px 5px;
      margin: 0 2px;
    }
  </style>
</head>
<body>
  <div class="emulator">
    <h1>Game Boy Emulator</h1>
    <div class="screen-container">
      <canvas id="gameboy-screen" width="160" height="144"></canvas>
    </div>
    <div class="controls">
      <button id="load-rom">Load ROM</button>
      <button id="start-button" disabled>Start</button>
      <button id="pause-button" disabled>Pause</button>
      <button id="reset-button" disabled>Reset</button>
      <input type="file" id="rom-input" class="file-input" accept=".gb,.gbc">
    </div>
    <div class="info">
      <p>Controls: <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> for D-pad, <kbd>Z</kbd> for A, <kbd>X</kbd> for B, <kbd>Enter</kbd> for Start, <kbd>Shift</kbd> for Select</p>
      <div id="status" class="status">Status: Ready to load ROM</div>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "gameboy/": "./js/"
    }
  }
  </script>

  <script type="module">
    import { GameBoy } from 'gameboy/main.js';
    
    // DOM elements
    const canvas = document.getElementById('gameboy-screen');
    const ctx = canvas.getContext('2d');
    const loadRomButton = document.getElementById('load-rom');
    const romInput = document.getElementById('rom-input');
    const startButton = document.getElementById('start-button');
    const pauseButton = document.getElementById('pause-button');
    const resetButton = document.getElementById('reset-button');
    const statusElement = document.getElementById('status');
    
    // Initialize the emulator
    let gameboy = null;
    
    // Event Listeners
    loadRomButton.addEventListener('click', () => {
      romInput.click();
    });
    
    romInput.addEventListener('change', async (event) => {
      if (event.target.files.length > 0) {
        const file = event.target.files[0];
        try {
          updateStatus(`Loading ROM: ${file.name}...`);
          const arrayBuffer = await file.arrayBuffer();
          const romData = new Uint8Array(arrayBuffer);
          
          // Initialize GameBoy with ROM data
          gameboy = new GameBoy(romData, canvas);
          
          updateStatus(`ROM loaded: ${file.name}`);
          startButton.disabled = false;
          resetButton.disabled = false;
        } catch (error) {
          updateStatus(`Error loading ROM: ${error.message}`);
          console.error('Error loading ROM:', error);
        }
      }
    });
    
    startButton.addEventListener('click', () => {
      if (gameboy) {
        if (gameboy.paused) {
          gameboy.start();
          startButton.textContent = 'Pause';
          updateStatus('Emulation running');
        } else {
          gameboy.pause();
          startButton.textContent = 'Resume';
          updateStatus('Emulation paused');
        }
      }
    });
    
    resetButton.addEventListener('click', () => {
      if (gameboy) {
        gameboy.reset();
        updateStatus('Emulator reset');
      }
    });
    
    function updateStatus(message) {
      statusElement.textContent = `Status: ${message}`;
      console.log(message);
    }
    
    // Keyboard input mapping
    document.addEventListener('keydown', (e) => {
      if (gameboy) gameboy.handleKeyDown(e);
    });
    
    document.addEventListener('keyup', (e) => {
      if (gameboy) gameboy.handleKeyUp(e);
    });
    
    // Initial message
    updateStatus('Ready to load ROM');

    // Handle unhandled promise rejections
    window.addEventListener('unhandledrejection', (event) => {
      console.error('Unhandled Promise Rejection:', event.reason);
      updateStatus(`Error: ${event.reason.message || 'Unknown error occurred'}`);
    });

    // Handle uncaught errors
    window.addEventListener('error', (event) => {
      console.error('Runtime Error:', event.message);
      updateStatus(`Error: ${event.message || 'Unknown error occurred'}`);
    });
  </script>

</body>
</html>
